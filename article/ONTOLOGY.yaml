# Онтология проекта: классы, отношения, правила и тезаурус предметной области.
# Составляет агент по постановке и источникам, принимает исследователь.
# Заметки и разделы статьи пользуются только этими терминами.

classes:
  Выборка:
    описание: набор галактик с фотометрией и спектроскопическим z; используется для обучения или оценки
    атрибуты: [имя, роль, число_объектов]
  Метод:
    описание: способ оценки photo-z по фотометрии
    атрибуты: [алгоритм, k, метрика_расстояния]
  Метрика:
    описание: мера качества photo-z с формулой по dz = (z_phot − z_spec)/(1 + z_spec)
    атрибуты: [формула, единицы]
  Результат:
    описание: числовое значение метрики на конкретной выборке
    атрибуты: [выборка, метрика, значение]
  Гипотеза:
    описание: утверждение о качестве photo-z, которое проверяют в эксперименте
    атрибуты: [текст, дата]
  Источник:
    описание: опубликованная работа с идентификатором OpenAlex или DOI
  Утверждение:
    описание: предложение статьи, требующее обоснования
  Прогон:
    описание: один запуск эксперимента или проверки
    атрибуты: [зерно, параметры, исход]

relations:
  обучаетсяНа: {domain: Прогон, range: Выборка}
  оцениваетсяНа: {domain: Прогон, range: Выборка}
  применяет: {domain: Прогон, range: Метод}
  даёт: {domain: Прогон, range: Результат}
  выраженВ: {domain: Результат, range: Метрика}
  проверяет: {domain: Прогон, range: Гипотеза}
  подтверждает: {domain: Результат, range: Гипотеза}
  опровергает: {domain: Результат, range: Гипотеза}
  ссылаетсяНа: {domain: Утверждение, range: Источник}
  хранитсяВ: {domain: [Выборка, Результат], range: Файл}

rules:
  - каждое числовое утверждение статьи обосновано прогоном, записанным в experiment/results/
  - каждое утверждение о чужой работе обосновано источником из lit/lit.md
  - результат не может одновременно подтверждать и опровергать одну гипотезу

thesaurus:
  photo-z: фотометрическое красное смещение, оценка z по фотометрическим признакам
  z_spec: спектроскопическое красное смещение, измеренное по линиям спектра
  z_phot: фотометрическое красное смещение, предсказанное моделью
  σ_NMAD: нормализованная медианная абсолютная ошибка, мера разброса photo-z
  bias: смещение photo-z, медиана dz
  выброс: объект с |dz| > 0,15
  kNN: метод k ближайших соседей
  Happy: набор каталогов галактик SDSS (Beck et al. 2017)