# Онтология проекта: классы, отношения, правила и тезаурус предметной области.
# Составляет агент по постановке и источникам, принимает исследователь.
# Заметки и разделы статьи пользуются только этими терминами.

classes:
  <Класс>:
    описание: <что это>
    атрибуты: [<…>]
  <Подкласс>:
    подкласс: <Класс>
    описание: <чем отличается>
  Источник:
    описание: опубликованная работа с идентификатором OpenAlex или DOI
  Утверждение:
    описание: предложение статьи, требующее обоснования
  Прогон:
    описание: один запуск эксперимента или проверки
    атрибуты: [зерно, параметры, исход]

relations:
  <отношение>: {domain: <Класс>, range: <Класс>}
  обоснован:   {domain: Утверждение, range: [Прогон, Источник]}

rules:
  - каждое числовое утверждение статьи обосновано прогоном, записанным в experiment/results/
  - каждое утверждение о чужой работе обосновано источником из lit/lit.md
  - <правило своей области>

thesaurus:
  <термин>: <определение в одну строку>
